name: Build fpk

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate icons (optional)
        run: python3 icon_gen.py .

      - name: Build fpk
        run: bash build.sh

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: daidai-panel-fn-fpk
          path: dist/*.fpk

      - name: Create Release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.fpk
          generate_release_notes: true
