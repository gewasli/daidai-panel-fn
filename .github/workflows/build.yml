name: Build fpk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate icons (optional)
        run: python3 icon_gen.py .

      - name: Build fpk
        run: bash build.sh

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: daidai-panel-fn-fpk
          path: dist/*.fpk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -E '^version=' manifest | head -n1 | cut -d= -f2-)"
          FPK="dist/daidai-panel-fn-${VERSION}.fpk"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${FPK}" --clobber
            echo "::notice::Release ${TAG} 已存在，已覆盖上传 ${FPK}"
          else
            gh release create "${TAG}" "${FPK}" --generate-notes --title "daidai-panel-fn ${VERSION}"
            echo "::notice::已创建 Release ${TAG} 并上传 ${FPK}"
          fi
