# ============================================================
# 呆呆面板 —— fnOS 原生应用（Docker 项目，容器内以 root 运行）
#
# 说明：
#   1. 不设 PUID/PGID，容器以 root 运行。这是关键：
#      - Linux 系统依赖（apt-get / apk）必须 root；
#      - npm / pip 需要 HOME 可写，非 root 时连 npm ls 都会失败。
#   2. 数据目录使用 fnOS 的 data-share，落在
#      /var/apps/daidai-panel-fn/shares/daidai-panel-fn/data
#      升级应用只替换程序目录，不会碰这个 share，因此内部更新不影响数据。
#   3. PANEL_UPDATE_MANAGER=disabled：关闭面板自带的 watchtower 自更新，
#      避免它去动别的容器。
# ============================================================
name: daidai-panel-fn

services:
  daidai-panel:
    image: linzixuanzz/daidai-panel:latest
    container_name: daidai-panel-fn
    restart: unless-stopped
    ports:
      - "5700:5700"
    volumes:
      - "/var/apps/daidai-panel-fn/shares/daidai-panel-fn/data:/app/Dumb-Panel"
    environment:
      - TZ=Asia/Shanghai
      - CONTAINER_NAME=daidai-panel-fn
      - IMAGE_NAME=linzixuanzz/daidai-panel:latest
      - PANEL_UPDATE_MANAGER=disabled
